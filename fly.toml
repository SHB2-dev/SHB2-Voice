# SHB2 読み上げBOT の Fly.io 設定(デプロイ用。GitHubのリポジトリには含めない)
# app の名前は世界で1つだけの名前にする必要があるので、デプロイ前に書き換える
app = "shb2-voice-v50ij"
primary_region = "nrt" # 東京

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"      # settings.json(サーバー辞書・声の設定・外部連携トークン等)の保存先(永続ボリューム)
  PORT = "8080"           # サイト/外部連携API。PORT があると 0.0.0.0 で待ち受ける
  PRIMARY_BOT = "1559949179604967554"
  VOICEVOX_BASE_URL = "https://open.voicevox.nogame-no.life"
  TRUST_PROXY = "true"    #Flyのプロキシの後ろなので、X-Forwarded-For を接続元として扱う

# 設定ファイルを残すための永続ボリューム(先に `fly volumes create data` で作る)
[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Discord Bot は常時つながっている必要があるので、止めない・1台だけ動かす
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/"
    timeout = "5s"

# 現在の稼働実績(Pterodactyl): メモリ約78MiB・CPU約1%。ffmpeg起動時の増加を見込んでも 256MB で足りる見込み。
# 落ちる(メモリ不足)ようなら `fly scale memory 512` で増やす
[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
